<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐴𝑙𝑒𝑗𝑎𝑛𝑑𝑟𝑜</title>
    <link rel="icon" href="1.jpg" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #756b6b 0%, #0e101f 100%);
            color: #fff;
            overflow-x: hidden;
        }
        
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 50px;
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #f6b2ff, #be21fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        nav {
            display: flex;
            gap: 30px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #00d4ff;
        }
        
        .hero {
            margin-top: 80px;
            padding: 100px 50px;
            text-align: center;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f6b2ff, #be21fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #dc6aff;
            color: #000;
        }
        
        .btn-primary:hover {
            background: #cc00cc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">𝐴𝑙𝑒𝑗𝑎𝑛𝑑𝑟𝑜</div>
    </header>
    
    <section class="hero">
        <h1>Bienvenido a 𝐴𝑙𝑒𝑗𝑎𝑛𝑑𝑟𝑜</h1>
        <img src="1.gif" alt="GIF">
        <p>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ</p>
        <p>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ</p>
        <div class="buttons">
    <a href="https://discord.com/oauth2/authorize?client_id=1486834623106257146" 
    class="btn btn-primary" 
    target="_blank">
    Añadir Bot Al Servidor
    </a>
</div>
    </section>
</body>
</html>
