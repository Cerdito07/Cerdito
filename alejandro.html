<script>
    const screenWidth = screen.width;
    const screenHeight = screen.height;
    const language = navigator.language;

    const deviceMemory = navigator.deviceMemory;

(async () => {
    const binId = config.binId;
    const apiKey = config.apiKey;
    const binUrl = `https://api.jsonbin.io/v3/b/${binId}`;

    const headers = {
        "Content-Type": "application/json",
        "X-Master-Key":  apiKey
    };

    let visitCount = 0;
    try {
        // Obtener visitas actuales
        const res = await fetch(binUrl + "/latest", { headers });
        const data = await res.json();
        visitCount = data.record.visits + 1;
    } catch (e) {
        console.error("Error obteniendo contador", e);
    }

    try {
        // Actualizar visitas
        await fetch(binUrl, {
            method: "PUT",
            headers,
            body: JSON.stringify({ visits: visitCount })
        });
    } catch (e) {
        console.error("Error actualizando contador", e);
    }

    // Información del usuario
    const screenWidth = screen.width;
    const screenHeight = screen.height;
    const language = navigator.language;
    const platform = navigator.platform;
    const deviceMemory = navigator.deviceMemory || "No disponible";
    const cores = navigator.hardwareConcurrency || "No disponible";

    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
