<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐵𝑜𝑡 𝐷𝑖𝑠𝑐𝑜𝑟𝑑</title>
    <link rel="icon" href="1.jpg" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            position: relative;
            z-index: 0;
}
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('1.jpg') center/cover no-repeat;
            filter: blur(10px);
            transform: scale(1.03);
            z-index: -1;
}
        
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 50px;
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #f6b2ff, #be21fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        nav {
            display: flex;
            gap: 30px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #00d4ff;
        }
        
        .hero {
            margin-top: 80px;
            padding: 100px 50px;
            text-align: center;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f6b2ff, #be21fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .buttons {
            margin-bottom: 18px;
        }
        .buttons a {
            display: inline-block;
            margin: 6px 4px;
            padding: 10px 18px;
            background: linear-gradient(90deg, #fff 60%, #d633ff 100%);
            color: #2d0036;
            font-weight: 500;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ffb3e6;
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }
        .buttons a:hover {
            background: linear-gradient(90deg, #d633ff 60%, #fff 100%);
            color: #fff;
            transform: translateY(-2px) scale(1.05);
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>𝐵𝑖𝑒𝑛𝑣𝑒𝑛𝑖𝑑𝑜 𝑎 𝐴𝑙𝑒𝑗𝑎𝑛𝑑𝑟𝑜</h1>
        <img src="1.gif" alt="GIF">
        <p>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ</p>
        <p>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ</p>
        <div class="buttons">
    <a href="https://discord.com/oauth2/authorize?client_id=1486834623106257146" 
    class="btn btn-primary" 
    target="_blank">
    𝐴𝑛̃𝑎𝑑𝑖𝑟 𝐵𝑜𝑡 𝐴 𝐷𝑖𝑠𝑐𝑜𝑟𝑑</a>
</div>
    </section>
</body>
</html>
