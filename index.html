<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐴𝑙𝑒𝑗𝑎𝑛𝑑𝑟𝑜</title>

    <body>
    <script src="keys.js"></script>

</body>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 8px 32px rgba(44,0,66,0.18);
            color: #fff;
            padding: 32px 28px 28px 28px;
            border-radius: 22px;
            text-align: center;
            max-width: 400px;
            border: 2px solid #ffb3e6;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 14px;
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            padding: 12px 0;
            border-radius: 16px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px #ffb3e6;
            border: 2px solid #ffb3e6;
        }
        p {
            font-size: 17px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            padding: 8px 0;
            border-radius: 14px;
            border: 2px solid #ffb3e6;
            box-shadow: 0 2px 8px #ffb3e6;
        }
        .buttons {
            margin-bottom: 18px;
        }
        .buttons a {
            display: inline-block;
            margin: 6px 4px;
            padding: 10px 18px;
            background: linear-gradient(90deg, #fff 60%, #d633ff 100%);
            color: #2d0036;
            font-weight: 500;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ffb3e6;
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }
        .buttons a:hover {
            background: linear-gradient(90deg, #d633ff 60%, #fff 100%);
            color: #fff;
            transform: translateY(-2px) scale(1.05);
        }
        .fortune-btn {
            padding: 12px 20px;
            background: linear-gradient(90deg, #fff 60%, #d633ff 100%);
            color: #2d0036;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px #ffb3e6;
            font-size: 16px;
            font-weight: 500;
            margin-top: 10px;
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }
        .fortune-btn:hover {
            background: linear-gradient(90deg, #d633ff 60%, #fff 100%);
            color: #fff;
            transform: translateY(-2px) scale(1.05);
        }
        #fortune-result {
            margin-top: 18px;
            font-size: 17px;
            min-height: 24px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 8px 0;
            border: 2px solid #ffb3e6;
            box-shadow: 0 2px 8px #ffb3e6;
        }
        /* Piggy Rain Styles */
        .piggy {
            position: fixed;
            top: -60px;
            font-size: 40px;
            pointer-events: auto;
            user-select: none;
            z-index: 1003 !important;
            animation: fallPiggy 4s linear forwards;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 6px #ffb3e6);
        }
        @keyframes fallPiggy {
            to {
                top: 110vh;
                transform: rotate(360deg);
            }
        }
        .piggy-counter {
            display: none;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1002;
            box-shadow: 0 2px 8px #ffb3e6;
            user-select: none;
            border: 2px solid #ffb3e6;
        }
        .piggy-label {
            position: fixed;
            top: 13px;
            right: 16px;
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            z-index: 1001;
            box-shadow: 0 2px 8px #ffb3e6;
            user-select: none;
            pointer-events: none;
            border: 2px solid #ffb3e6;
        }
        /* Floating Buttons */
        .floating-btn {
            position: fixed;
            background: linear-gradient(90deg, #fff 60%, #d633ff 100%);
            color: #2d0036;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px #ffb3e6;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s, color 0.3s, transform 0.2s;
            z-index: 1001;
        }
        .floating-btn:hover {
            background: linear-gradient(90deg, #d633ff 60%, #fff 100%);
            color: #ffb3e6;
            transform: translateY(-2px) scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>𝘉𝘪𝘦𝘯𝘷𝘦𝘯𝘪𝘥@ 𝘢 𝘭𝘢 𝘞𝘦𝘣 𝘥𝘦 𝘈𝘭𝘦𝘫𝘢𝘯𝘥𝘳𝘰</h1>
        <p>𝘙𝘦𝘥𝘦𝘴</p>
        <div class="buttons">
            <a href="https://www.instagram.com/alexhvr07/" target="_blank">𝘐𝘯𝘴𝘵𝘢𝘨𝘳𝘢𝘮</a>
            <a href="https://www.tiktok.com/@alexhvr07" target="_blank">𝘛𝘪𝘬𝘛𝘰𝘬</a>
            <a href="https://www.youtube.com/@alexhvr07" target="_blank">𝘠𝘰𝘶𝘵𝘶𝘣𝘦</a>
            <a href="https://www.twitch.tv/alexhvr07" target="_blank">𝘛𝘸𝘪𝘵𝘤𝘩</a>
            <a href="https://open.spotify.com/user/9ykgrdb7cleze98pwx2oeux0h?si=54a6bc76ad124287" target="_blank">𝘚𝘱𝘰𝘵𝘪𝘧𝘺</a>
        </div>
    </div>

<script>
    const screenWidth = screen.width;
    const screenHeight = screen.height;
    const language = navigator.language;
    const platform = navigator.platform;
    const deviceMemory = navigator.deviceMemory;
    const cores = navigator.hardwareConcurrency;

(async () => {
    const binId = config.binId;
    const apiKey = config.apiKey;
    const binUrl = `https://api.jsonbin.io/v3/b/${binId}`;

    const headers = {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey
    };

    let visitCount = 0;
    try {
        // Obtener visitas actuales
        const res = await fetch(binUrl + "/latest", { headers });
        const data = await res.json();
        visitCount = data.record.visits + 1;
    } catch (e) {
        console.error("Error obteniendo contador", e);
    }

    try {
        // Actualizar visitas
        await fetch(binUrl, {
            method: "PUT",
            headers,
            body: JSON.stringify({ visits: visitCount })
        });
    } catch (e) {
        console.error("Error actualizando contador", e);
    }

    // Información del usuario
    const screenWidth = screen.width;
    const screenHeight = screen.height;
    const language = navigator.language;
    const platform = navigator.platform;
    const deviceMemory = navigator.deviceMemory || "No disponible";
    const cores = navigator.hardwareConcurrency || "No disponible";
    const userAgent = navigator.userAgent;
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();

        const webhookUrl = config.webhookUrl;

        const embed = {
            embeds: [
                {
                    title: "🐷 𝘕𝘶𝘦𝘷𝘰 𝘷𝘪𝘴𝘪𝘵𝘢𝘯𝘵𝘦 𝘦𝘯 𝘭𝘢 𝘸𝘦𝘣 𝘥𝘦𝘭 𝘈𝘭𝘦𝘫𝘢𝘯𝘥𝘳𝘰",
                    color: 0xffb3e6,
                    fields: [
                        { name: "🌍 𝘐𝘗", value: ipData.ip, inline: true },
                        { name: "🖥️ 𝘕𝘢𝘷𝘦𝘨𝘢𝘥𝘰𝘳", value: userAgent, inline: false },
                        { name: "🕒 𝘡𝘰𝘯𝘢 𝘏𝘰𝘳𝘢𝘳𝘪𝘢", value: timezone, inline: true },
                        { name: "📅 𝘍𝘦𝘤𝘩𝘢", value: new Date().toLocaleString(), inline: true },
                        { name: "🌐 𝘐𝘥𝘪𝘰𝘮𝘢", value: language, inline: true },
                        { name: "📱  𝘙𝘦𝘴𝘰𝘭𝘶𝘤𝘪𝘰́𝘯", value: `${screenWidth}x${screenHeight}`, inline: true },
                        { name: "💻 𝘗𝘭𝘢𝘵𝘢𝘧𝘰𝘳𝘮𝘢", value: platform, inline: true },
                        { name: "🧠 𝘕𝘶́𝘤𝘭𝘦𝘰𝘴 𝘊𝘗𝘜", value: `${cores}`, inline: true },
                        { name: "🧮 𝘙𝘈𝘔 𝘦𝘴𝘵𝘪𝘮𝘢𝘥𝘢", value: `${deviceMemory} GB`, inline: true }
                    ],
                footer: {       
                text: `𝘈𝘭𝘦𝘫𝘢𝘯𝘥𝘳𝘰 | 👥: ${visitCount}`
                },
                    timestamp: new Date().toISOString()
                }
            ]
        };

        await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                content: "<@583908818367414272>",
                ...embed
            })
        });

    } catch (err) {
        console.error("Error enviando a Discord:", err);
    }
})();
</script>
</script>
</body>
</html>
